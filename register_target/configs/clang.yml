        #ifndef LLVM_CLANG_LIB_BASIC_TARGETS_<TARGET>_H
        
        #define LLVM_CLANG_LIB_BASIC_TARGETS_<TARGET>_H

        #include "clang/Basic/TargetInfo.h"
        
        #include "clang/Basic/TargetOptions.h"
        
        #include "llvm/Support/Compiler.h"
        
        #include "llvm/TargetParser/Triple.h"

        namespace clang {
        
        namespace targets {

        class LLVM_LIBRARY_VISIBILITY <Target>TargetInfo : public TargetInfo {
          static const char *const GCCRegNames[];

        public:
          <Target>TargetInfo(const llvm::Triple &Triple, const TargetOptions &)
              : TargetInfo(Triple) {
            // This assert was left intentionally to remind the user to implement the resetDataLayout according to the target
            assert(false && "resetDataLayout function not implemented. Please implement it according to the particularities of your target.");
          }
          void getTargetDefines(const LangOptions &Opts,
                                MacroBuilder &Builder) const override;

          ArrayRef<Builtin::Info> getTargetBuiltins() const override {
            // FIXME: Implement.
            return std::nullopt;
          }

          bool allowsLargerPreferedTypeAlignment() const override { return false; }

          bool hasFeature(StringRef Feature) const override {
            return Feature == "<TARGET>";
          }

          ArrayRef<const char *> getGCCRegNames() const override;

          ArrayRef<TargetInfo::GCCRegAlias> getGCCRegAliases() const override {
            // Make r0 - r3 be recognized by llc (f.e., in clobber list)
            static const TargetInfo::GCCRegAlias GCCRegAliases[] = {
                {{"r0"}, "pc"},
                {{"r1"}, "sp"},
                {{"r2"}, "sr"},
                {{"r3"}, "cg"},
            };
            return llvm::ArrayRef(GCCRegAliases);
          }

          bool validateAsmConstraint(const char *&Name,
                                    TargetInfo::ConstraintInfo &info) const override {
            // Implement
            return false;
          }

          std::string_view getClobbers() const override {
            // FIXME: Implement
            return "";
          }

          BuiltinVaListKind getBuiltinVaListKind() const override {
            // FIXME: implement
            return TargetInfo::CharPtrBuiltinVaList;
          }
        
        };

        } // namespace targets
        
        } // namespace clang
        
        #endif // LLVM_CLANG_LIB_BASIC_TARGETS_<TARGET>_H

    
