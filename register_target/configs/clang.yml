  - file_path: clang/lib/Driver/ToolChains/Clang.cpp
    changes:
      - type: string
        content: >2
            case llvm::Triple::<target>:
              Add<Target>TargetArgs(Args, CmdArgs);
              break;
        pattern: AddLanaiTargetArgs(Args, CmdArgs);
        relative_location: after
        offset: 1
      - type: string
        content: >2
          void Clang::Add<Target>TargetArgs(const ArgList &Args,
                                         ArgStringList &CmdArgs) const {
            if (Arg *A = Args.getLastArg(options::OPT_mcpu_EQ)) {
              StringRef CPUName = A->getValue();
          
              CmdArgs.push_back("-target-cpu");
              CmdArgs.push_back(Args.MakeArgString(CPUName));
            }
            if (Arg *A = Args.getLastArg(options::OPT_mregparm_EQ)) {
              StringRef Value = A->getValue();
              // Only support mregparm=4 to support old usage. Report error for all other
              // cases.
              int Mregparm;
              if (Value.getAsInteger(10, Mregparm)) {
                if (Mregparm != 4) {
                  getToolChain().getDriver().Diag(
                      diag::err_drv_unsupported_option_argument)
                      << A->getSpelling() << Value;
                }
              }
            }
          }
        pattern: void Clang::AddHexagonTargetArgs
        relative_location: before
  
