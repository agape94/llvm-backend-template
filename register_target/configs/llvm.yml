modifications:
  - file_path: llvm/include/llvm/Object/ELFObjectFile.h
    changes:
    - type: switch_case_nested
      location: getFileFormatName
      content: >2
            case ELF::EM_<TARGET>:
              return "elf<bit-width>-<target>";
      parent_switch_condition: EF.getHeader().e_ident[ELF::EI_CLASS]
      switch_condition: EF.getHeader().e_machine
      parent_case_name: ELF::ELFCLASS<bit-width>
      min_bit_width: 32
    - type: switch_case
      location: getArch
      content: >2
          case ELF::EM_<TARGET>:
            return Triple::<target>;
      switch_condition: EF.getHeader().e_machine
  - file_path: llvm/include/llvm/BinaryFormat/ELF.h
    changes:
    - type: unnamed_enum_value
      location: 
      content: >2
          EM_<TARGET>
      pattern: EM_
      value: true
      comment: >2
        // <Target>: <Target> <bit-width>-bit architecture
    - type: string
      pattern: "#define ELF_RELOC(name, value) name = value,"
      relative_location: after
      content: >2  
        // ELF Relocation type for <Target>.
        enum {
          #include "ELFRelocs/<Target>.def"
        };
  - file_path: llvm/include/llvm/BinaryFormat/ELFRelocs/<Target>.def
    changes:
    - type: new_file
      content: >2
          #ifndef ELF_RELOC
          #error "ELF_RELOC must be defined"
          #endif

          // No relocation
          ELF_RELOC(R_<TARGET>_NONE,        0)
  - file_path: llvm/include/llvm/TargetParser/Triple.h
    changes:
    - type: named_enum_value
      location: ArchType
      content: >2
            <target>
      comment: >2
        // <Target>: <Target> <bit-width>-bit architecture
      pattern: ve
      relative_location: before
    - type: string
      pattern: isX86
      relative_location: before
      offset: -1
      content: >2
          // Tests whether the target is <Target>.
          bool is<Target>() const {
            return getArch() == Triple::<target>;
          }
  - file_path: llvm/lib/BinaryFormat/ELF.cpp
    changes:
    - type: string
      content: >2
              .Case("<target>", EM_<TARGET>)
      pattern: .Default(EM_NONE);
      relative_location: before
    - type: switch_case
      location: convertEMachineToArchName
      content: >2
          case ELF::EM_<TARGET>:
            return "<target>";
      switch_condition: EMachine
  - file_path: llvm/lib/Object/ELF.cpp
    changes:
    - type: switch_case
      location: getELFRelocationTypeName
      content: >2
          case ELF::EM_<TARGET>:
            switch (Type) {
        #include "llvm/BinaryFormat/ELFRelocs/<Target>.def"
            default:
              break;
            }
            break;
      switch_condition: Machine
    - type: switch_case
      location: getELFRelativeRelocationType
      content: >2
          case ELF::EM_<TARGET>:
            break;
      switch_condition: Machine
  - file_path: llvm/lib/Object/RelocationResolver.cpp
    changes:
    - type: string
      content: >2
        static bool supports<Target>(uint64_t Type) {
          return Type == ELF::R_<TARGET>_NONE;
        }

        static uint64_t resolve<Target>(uint64_t Type, uint64_t Offset, uint64_t S, uint64_t /*LocData*/, int64_t Addend) {
          if (Type == ELF::R_<TARGET>_NONE)
            return S + Addend;
          llvm_unreachable("Invalid relocation type");
        }
      pattern: static bool supportsARM(uint64_t Type)
      relative_location: before
    - type: string
      content: >2
            case Triple::<target>:
              return {supports<Target>, resolve<Target>};
      pattern: case Triple::lanai
      relative_location: before
  - file_path: llvm/lib/ObjectYAML/ELFYAML.cpp
    changes:
    - type: string
      pattern: ECase(EM_NONE)
      content: >2
          ECase(EM_<TARGET>);
      relative_location: after
    - type: string
      pattern: >2
        #include "llvm/BinaryFormat/ELFRelocs/RISCV.def"
      content: >2
          case ELF::EM_<TARGET>:
        #include "llvm/BinaryFormat/ELFRelocs/<Target>.def"
            break;
      relative_location: after
      offset: 1
  - file_path: llvm/lib/TargetParser/Triple.cpp
    changes:
    - type: switch_case
      location: getArchTypeName
      content: >2
          case <target>: return "<target>";
      switch_condition: Kind
    - type: switch_case
      location: getArchTypePrefix
      content: >2
          case <target>: return "<target>";
      switch_condition: Kind
    - type: string
      location: getArchTypeForLLVMName
      content: >2
            .Case("<target>", <target>)
      pattern: .Default(UnknownArch);
      relative_location: before
    - type: string
      location: parseArch
      content: >2
            .Case("<target>", Triple::<target>)
      pattern: .Default(Triple::UnknownArch);
      relative_location: before
    - type: switch_case
      location: getDefaultFormat
      content: >2
          case Triple::<target>:
            return ELF;
      switch_condition: T.getArch()
    - type: switch_case
      location: getArchPointerBitWidth
      content: >2
          case Triple::<target>:
            return <bit-width>;
      switch_condition: Arch
    - type: switch_case
      location: get32BitArchVariant
      content: >2
          case Triple::<target>:
      correct_bit_width_content: >2
            break;
      wrong_bit_width_content: >2
            T.setArch(Triple::UnknownArch);
      switch_condition: getArch()
      bit_width: 32
    - type: switch_case
      location: get64BitArchVariant
      content: >2
          case Triple::<target>:
      correct_bit_width_content: >2
            break;
      wrong_bit_width_content: >2
            T.setArch(Triple::UnknownArch);
      switch_condition: getArch()
      bit_width: 64
    - type: switch_case
      location: isLittleEndian
      content: >2
          case Triple::<target>:
      switch_condition: getArch()
      endianness: little
